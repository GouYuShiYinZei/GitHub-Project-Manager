[package]
name = "github-star-manager"
version = "0.1.2"
description = "A local-first GitHub Star analysis manager"
authors = ["GitHub Star Manager"]
edition = "2021"

[lib]
name = "github_star_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "=2.6.1"
